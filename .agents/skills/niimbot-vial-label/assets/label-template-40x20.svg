<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="40mm" height="20mm" viewBox="0 0 40 20">
  <!--
    NIIMBOT vial label template, 40x20mm, black thermal on transparent stock.
    All coordinates are millimeters. Proven layout constraints:
      - Text zone starts at x=1.7. Fact lines (Helvetica Neue Condensed Bold
        2.0mm) must each MEASURE <= ~25.5mm wide (right edge <= 26.9) or they
        collide with the QR at x=27.3. A line that clears the limit by only a
        few tenths of a mm is a failure in waiting: rebalance the wording
        between lines instead of squeezing. Verify with scripts/measure_ink.py.
      - Title: 4.6mm, baseline y=5.6, rule below. Do not enlarge: at 4.9mm the
        arms reach into the QR column.
      - QR: 11.2x11.2 at x=27.3, y=4.0. Embed it as a base64 DATA URI in
        xlink:href (data:image/png;base64,...). librsvg 2.62+ (rsvg-convert)
        SILENTLY drops file hrefs that escape the SVG's directory —
        ../qr/name.png renders blank with exit 0 — and a bare filename points
        into labels/ where no QR lives. Keep the source qr/ asset registered
        in links.csv and note it in a comment in the SVG.
      - RECON line (y=16.7) is intentionally blank: "RECON" + underline rect,
        to hand-write the reconstitution date after mixing.
      - Keep fact lines at the same font size as each other; shorten wording
        rather than mixing sizes. Print only user-verified values.
  -->
  <rect x="0" y="0" width="40" height="20" fill="#ffffff"/>
  <rect x="0.45" y="0.45" width="39.1" height="19.1" rx="1.4" ry="1.4" fill="none" stroke="#000000" stroke-width="0.38"/>

  <text x="1.7" y="5.6" font-family="Helvetica Neue" font-weight="700" font-stretch="condensed" font-size="4.6" fill="#000000">COMPOUND</text>
  <rect x="1.7" y="6.65" width="24.2" height="0.28" fill="#000000"/>

  <text x="1.7" y="9.9"  font-family="Helvetica Neue" font-weight="700" font-stretch="condensed" font-size="2.0" fill="#000000">AMOUNT &#8226; REAL MASS 00.00 MG</text>
  <text x="1.7" y="13.3" font-family="Helvetica Neue" font-weight="700" font-stretch="condensed" font-size="2.0" fill="#000000">BATCH/CAP &#8226; TESTED MM/DD/YYYY</text>
  <text x="1.7" y="16.7" font-family="Helvetica Neue" font-weight="700" font-stretch="condensed" font-size="2.0" fill="#000000">RECON</text>
  <rect x="8.6" y="16.75" width="14.4" height="0.25" fill="#000000"/>

  <image x="27.3" y="4.0" width="11.2" height="11.2" xlink:href="data:image/png;base64,QR_BASE64_HERE"/>
  <text x="32.9" y="16.9" font-family="Helvetica Neue" font-weight="700" font-stretch="condensed" font-size="1.8" fill="#000000" text-anchor="middle">COA</text>
</svg>
